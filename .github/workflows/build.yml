name: Build LockGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP & Create Folders in GitHub Repo
        run: |
          if [ -f "LockGuard-Project.zip" ]; then
            echo "Found LockGuard-Project.zip! Extracting folders into repository..."
            unzip -o LockGuard-Project.zip
            rm -f LockGuard-Project.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-extracted LockGuard project folders from ZIP" || true
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Realme6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
