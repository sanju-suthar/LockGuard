name: Build LockGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project ZIP (If uploaded directly from Mobile)
        run: |
          if [ -f "LockGuard-Project.zip" ] && [ ! -f "settings.gradle" ]; then
            echo "Found LockGuard-Project.zip! Extracting project files..."
            unzip -o LockGuard-Project.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Realme6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
