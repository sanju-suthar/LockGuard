name: Build Signed Release LockGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP & Update Code in GitHub Repo
        run: |
          shopt -s nullglob
          for z in LockGuard-Project*.zip; do
            echo "Found $z! Extracting updated code into repository..."
            unzip -o "$z" "app/*" "build.gradle" "settings.gradle" "gradle.properties" -x "app/release-key.jks"
            rm -f "$z" "app/release-key.jks"
            python3 -c 'p="app/build.gradle"; s=open(p).read(); s=s.replace("\"LockGuard@2026\"", "System.getenv(\"KEYSTORE_PASSWORD\") ?: \"\""); open(p,"w").write(s)'
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-extracted LockGuard v1.4.0 update from $z" || true
            git push || true
          done
          if [ -f "app/release-key.jks" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -f app/release-key.jks || rm -f app/release-key.jks
            git commit -m "Security: Remove public release-key.jks from repository" || true
            git push || true
          fi
          echo "-dontwarn **" >> app/proguard-rules.pro

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode Secret Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > app/release-key.jks

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -x lint --stacktrace

      - name: Clean Up Temporary Keystore
        if: always()
        run: rm -f app/release-key.jks

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Realme6-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
