name: Build Signed Release LockGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP & Create Folders in GitHub Repo (if ZIP uploaded)
        run: |
          if [ -f "LockGuard-Project.zip" ]; then
            echo "Found LockGuard-Project.zip! Extracting folders into repository..."
            unzip -o LockGuard-Project.zip
            rm -f LockGuard-Project.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-extracted Signed Release LockGuard project" || true
            git push || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Release Keystore Exists
        run: |
          if [ ! -f "app/release-key.jks" ]; then
            echo "Generating release-key.jks..."
            keytool -genkeypair -v               -keystore app/release-key.jks               -keyalg RSA -keysize 2048 -validity 10000               -alias lockguard_key               -storepass "LockGuard@2026"               -keypass "LockGuard@2026"               -dname "CN=LockGuard Security, OU=Mobile, O=LockGuard, L=Jaipur, ST=Rajasthan, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release-key.jks
            git commit -m "Add generated release keystore for consistent signing" || true
            git push || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LockGuard-Realme6-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
